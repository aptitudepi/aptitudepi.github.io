# Build and deploy the static site to GitHub Pages.
#
# Everything on /resume, /cv, /man/, and assets/*.pdf is GENERATED here from
# the private aptitudepi/Full-CV TeX source — nothing is committed. The Full-CV
# checkout requires a fine-grained PAT (secrets.FULL_CV_PAT) with Contents: Read
# access on aptitudepi/Full-CV only.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:
    inputs:
      full_cv_ref:
        description: "Full-CV git ref to build from (branch, tag, or SHA)"
        required: false
        default: "main"
      use_gh_hosted:
        description: "Run on GitHub-hosted ubuntu-latest instead (consumes Actions minutes)"
        required: false
        default: "false"
        type: boolean

  # Keep resume/cv in sync with Full-CV even without site changes.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FULL_CV_REF: ${{ inputs.full_cv_ref || 'main' }}

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.use_gh_hosted == 'true' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v5

      - name: Checkout Full-CV content
        uses: actions/checkout@v5
        with:
          repository: aptitudepi/Full-CV
          ref: ${{ env.FULL_CV_REF }}
          path: full-cv
          token: ${{ secrets.FULL_CV_PAT }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Tectonic
        run: |
          curl -fL -o tectonic.tar.gz \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
          tar xzf tectonic.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 755 tectonic "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Tectonic downloads fonts/packages from its remote bundle on demand.
      # Cache the bundle so builds are offline once populated and flaky
      # font fetches can no longer tear the PDF (see tools/build-pdf.mjs).
      - name: Cache Tectonic bundle
        uses: actions/cache@v5
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-bundle-0.17.0

      - name: Build HTML
        run: bun tools/build.mjs
        env:
          FULL_CV_DIR: ${{ github.workspace }}/full-cv

      - name: Build PDFs
        run: bun tools/build-pdf.mjs
        env:
          FULL_CV_DIR: ${{ github.workspace }}/full-cv

      # Guard against silent content loss (the Aug 2026 incident: missing
      # fonts + continue-on-errors shipped a resume stripped of its Education,
      # Experience, Skills and Honors sections while the job "passed").
      - name: Verify PDFs contain required sections
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils >/dev/null
          elif command -v pacman >/dev/null; then
            command -v pdftotext >/dev/null || sudo pacman -S --noconfirm poppler
          else
            echo "no known package manager; assuming poppler present"
          fi
          command -v pdftotext >/dev/null || { echo "pdftotext unavailable"; exit 1; }
          for f in assets/resume.pdf assets/cv.pdf; do
            [ -s "$f" ] || { echo "MISSING $f"; exit 1; }
          done
          text=$(pdftotext assets/resume.pdf -)
          for s in "Texas A&M" "National Merit" "C/C++" "HowdyHack"; do
            printf '%s' "$text" | grep -F -q "$s" \
              || { echo "resume.pdf missing content: $s"; exit 1; }
          done
          pdftotext assets/cv.pdf - | grep -F -q "Texas A&M" \
            || { echo "cv.pdf missing content: Texas A&M"; exit 1; }

      - name: Remove Full-CV checkout from artifact
        # full-cv/ is a build-only checkout; never shipped.
        run: rm -rf full-cv

      # CI build metadata for the terminal (`uname -a`, `changelog`/`dmesg`):
      # consumed at runtime via fetch no-store; absent on local previews, so
      # those paths keep their static fallbacks.
      # Blog (Flow A: posts/*.md → frozen blog/ HTML + rss.xml + posts.json).
      # Runs before sitemap/IndexNow so per-post lastmod + URL lists include
      # posts free via tools/site-urls.mjs. Drafts never build in CI prod
      # (BUILD_DRAFTS unset → zero draft bytes); sources are stripped from the
      # artifact below, so _drafts/ can never leak into the deploy.
      # Image outputs rebuild clean every run (E6: build-blog.mjs rm -rf's
      # blog/ — stale variants must never deploy); at ~10 posts/yr re-encode
      # is seconds, while renderPostImages mtime-skip covers local rebuilds,
      # so no actions/cache on image outputs. Bun store cached instead.
      - name: Cache bun store
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install blog build deps
        run: bun install

      - name: Build blog
        run: bun tools/build-blog.mjs

      - name: Assert blog RSS
        run: bun tools/assert-rss.mjs

      # Pagefind search index, blog pages only (--glob scoping per E4; shell
      # chrome carries data-pagefind-ignore via build-blog post-replace so the
      # shared shell.html stays byte-identical, and draft articles carry
      # ignore="all"). PAGEFIND=0 skips the index (heavy-gate); default on.
      # Bundle lands in /pagefind/ (gitignored, deployed with the artifact);
      # UI lazy-loads it on the blog index only — zero cost on post pages.
      - name: Build Pagefind index
        run: |
          if [ "${PAGEFIND:-1}" = 0 ]; then echo "PAGEFIND=0 — skipping index"; exit 0; fi
          bun run build:pagefind

      - name: Write build-info.json
        run: |
          printf '{"sha":"%s","run_number":"%s","built_at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" > build-info.json

      # sitemap.xml from the shared URL list (tools/site-urls.mjs); lastmod is
      # this deploy. Same list feeds the IndexNow submit after Pages is live.
      - name: Generate sitemap.xml
        run: bun tools/sitemap.mjs

      # IndexNow ownership proof — key lives only in secrets, never committed.
      # Served at https://dvxb.io/{INDEXNOW_KEY}.txt after deploy.
      # https://www.indexnow.org/documentation.html
      - name: Write IndexNow key file
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "INDEXNOW_KEY not set; skipping key file"
            exit 0
          fi
          printf '%s' "$INDEXNOW_KEY" > "${INDEXNOW_KEY}.txt"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove post sources from artifact
        # posts/ holds md sources + _drafts (unpublished by definition): frozen
        # blog/ HTML is the serve path, so sources must never deploy — otherwise
        # draft bodies would ship as static files. Must run AFTER build-blog.
        run: rm -rf posts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload the whole workspace — includes the generated
          # resume.html/cv.html/man/ and assets/*.pdf on disk.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Ping IndexNow partners after the key file is live. Google does not
      # participate; Bing/Yandex/etc. share submissions from this endpoint.
      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bun tools/indexnow.mjs
