<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #1e1e2a;
    --text: #d4d4d8;
    --text-muted: #8888a0;
    --text-faint: #555570;
    --accent: #5090f0;
    --accent-dim: #5090f0/0.1;
    --radius: 8px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
    line-height: 1.7;
    padding: 0;
    -webkit-font-smoothing: antialiased;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    background: oklch(0.06 0.005 260 / 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .toolbar .url-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 200ms;
  }
  .toolbar .url-input:focus { border-color: var(--accent); }
  .toolbar button {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background 200ms, border-color 200ms;
  }
  .toolbar button:hover { border-color: var(--accent); background: oklch(0.15 0.02 260); }
  .toolbar .status {
    color: var(--text-faint);
    font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: nowrap;
  }
  #content {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }
  #content h1 { font-size: 2rem; font-weight: 700; margin: 0 0 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; color: var(--text); }
  #content h2 { font-size: 1.5rem; font-weight: 600; margin: 32px 0 12px; color: var(--text); }
  #content h3 { font-size: 1.2rem; font-weight: 600; margin: 28px 0 10px; color: var(--text); }
  #content p { margin: 0 0 16px; color: var(--text-muted); }
  #content a { color: var(--accent); text-decoration: none; }
  #content a:hover { text-decoration: underline; }
  #content ul, #content ol { margin: 0 0 16px; padding-left: 24px; color: var(--text-muted); }
  #content li { margin: 4px 0; }
  #content blockquote {
    margin: 0 0 16px;
    padding: 8px 16px;
    border-left: 3px solid var(--accent);
    background: oklch(0.12 0.01 260 / 0.5);
    border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--text-faint);
  }
  #content pre {
    margin: 0 0 16px;
    padding: 16px;
    border-radius: var(--radius);
    background: oklch(0.08 0.005 260);
    border: 1px solid var(--border);
    overflow-x: auto;
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  #content code {
    font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 0.875em;
    padding: 2px 6px;
    background: oklch(0.1 0.01 260 / 0.7);
    border-radius: 4px;
    color: var(--text);
  }
  #content pre code { padding: 0; background: none; font-size: 13px; }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  #content table { width: 100%; border-collapse: collapse; margin: 0 0 16px; }
  #content th, #content td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; font-size: 14px; }
  #content th { background: var(--surface); color: var(--text); font-weight: 600; }
  #content td { color: var(--text-muted); }
  #content img { max-width: 100%; border-radius: var(--radius); margin: 16px 0; }
  #content details { margin: 0 0 16px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  #content details summary { cursor: pointer; font-weight: 600; color: var(--text); }
  #content details[open] summary { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .error { color: #e06070; text-align: center; padding: 40px; }
  .loading { text-align: center; padding: 60px; color: var(--text-faint); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="toolbar">
  <input class="url-input" id="urlInput" type="text" placeholder="Enter a raw markdown URL...">
  <button id="goBtn">Load</button>
  <span class="status" id="status"></span>
</div>
<div id="content"><div class="loading"><div class="spinner"></div><br>Enter a URL above to render markdown</div></div>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script>
const content = document.getElementById('content');
const urlInput = document.getElementById('urlInput');
const goBtn = document.getElementById('goBtn');
const statusEl = document.getElementById('status');

function render(md) {
  if (!window.marked) {
    content.innerHTML = '<div class="error">Marked library failed to load. Reload the page.</div>';
    return;
  }
  marked.setOptions({ breaks: true, gfm: true });
  const html = marked.parse(md);
  const clean = DOMPurify ? DOMPurify.sanitize(html) : html;
  content.innerHTML = clean;
  document.querySelectorAll('pre code').forEach(block => {
    block.addEventListener('dblclick', () => {
      const range = document.createRange();
      range.selectNodeContents(block);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    });
  });
}

async function load(url) {
  if (!url) { content.innerHTML = '<div class="loading">Enter a URL above to render markdown</div>'; return; }
  content.innerHTML = '<div class="loading"><div class="spinner"></div><br>Loading...</div>';
  statusEl.textContent = 'Fetching...';
  try {
    const resp = await fetch(url, { mode: 'cors' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const text = await resp.text();
    statusEl.textContent = `${(text.length / 1024).toFixed(1)} KB`;
    render(text);
  } catch (e) {
    statusEl.textContent = 'Error';
    content.innerHTML = `<div class="error">Failed to load markdown:<br>${e.message}</div>`;
  }
}

const params = new URLSearchParams(window.location.search);
const initialUrl = params.get('url');
if (initialUrl) {
  urlInput.value = initialUrl;
  load(initialUrl);
}

goBtn.addEventListener('click', () => load(urlInput.value.trim()));
urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') load(urlInput.value.trim()); });
</script>
</body>
</html>
